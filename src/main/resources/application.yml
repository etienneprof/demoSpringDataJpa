
spring:
  application:
    name: demo_spring_data

  datasource:
    url: jdbc:mariadb://localhost:32769/demoFull
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  security:
    user:
      name: dev
      password: dev

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
